# 変更を push するたびに、壊れていないかを自動で確認する。
# 失敗したら GitHub の Pull Request 画面に赤いバツが出る。
name: CI

on:
  # PR 中のブランチは pull_request 側で回るので、push は main だけにする
  # （両方を指定すると同じコミットで 2 回実行されてしまう）
  push:
    branches: [main]
  pull_request:

jobs:
  # ── アプリ側: 型の不整合とビルドエラーを見つける ──────────────────
  apps:
    name: アプリのビルド確認
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # バージョンは package.json の packageManager から読ませる。
      # ここで version を指定すると二重指定でエラーになる。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Accessory receipt parent readiness
        run: node --test scripts/extension-tests/accessory-receipt.test.mjs

      - name: Yahoo buyer receipt resume safety
        run: node --test scripts/extension-tests/yahoo-workflow.test.mjs scripts/extension-tests/buyer-receipt-repair.test.mjs scripts/extension-tests/yahoo-rating-audit-runtime.test.mjs

      - name: Daily price reduction guards
        run: node --test scripts/extension-tests/daily-price.test.mjs scripts/extension-tests/daily-price-api.test.mjs

      - name: 型チェック
        run: pnpm -r typecheck

      - name: 仕入れリストから予備登録
        run: node scripts/verify-purchase-draft-spare.cjs

      - name: ビルド
        run: pnpm -r build

      - name: 管理画面と拡張機能の認証分離
        run: node --test scripts/extension-tests/operation-queue-recovery.test.mjs scripts/extension-tests/yahoo-tracking-fallback.test.mjs scripts/extension-tests/navigation-pacing.test.mjs scripts/extension-tests/seller-feedback-runtime.test.mjs scripts/extension-tests/seller-feedback-api.test.mjs scripts/verify-seller-runtime.test.mjs scripts/extension-tests/four-sales.test.mjs scripts/extension-tests/seller-runtime.test.mjs scripts/extension-tests/seller-inspection.test.mjs scripts/extension-tests/shipping-choice-readiness.test.mjs && node scripts/verify-receipt-evaluation-tasks.cjs && node scripts/verify-unified-description.cjs && node scripts/verify-workflow-confirmation.cjs && node scripts/verify-work-completion.cjs && node scripts/verify-listing-approval.cjs && node scripts/verify-seller-defaults.cjs && node scripts/verify-workflow-actions.cjs && node scripts/verify-calculator-mobile.cjs && node scripts/verify-product-summary.cjs && node scripts/verify-purchase-spare-ui.cjs && node scripts/verify-purchase-list-refresh.cjs && node scripts/verify-available-spares.cjs && node scripts/verify-resource-sync.cjs && node scripts/verify-transfer-cache.cjs && node scripts/verify-inventory-sync.cjs && node scripts/verify-seller-status.cjs && node scripts/verify-built-app-styles.cjs && node scripts/verify-app-switch.cjs && node scripts/verify-expense-panel-open.cjs && node scripts/verify-delivery-push-worker.cjs && node scripts/verify-admin-push-worker.cjs && node scripts/verify-independent-auth.cjs && node scripts/verify-product-family-sales.mjs && node scripts/verify-inventory-search.cjs && node scripts/verify-receipt-invoice-pdf.cjs && node scripts/verify-gross-profit-scope.cjs

      - name: 稼働と写真登録の確認
        run: node --test supabase/functions/delivery-photo-drive/index_test.cjs && node scripts/verify-workload-arrival-removal.cjs && node scripts/verify-listing-photo-integration.cjs && node scripts/verify-delivery-load-error.cjs && node scripts/verify-spare-shipping-ui.cjs && node scripts/verify-admin-task-confirmation.cjs && node scripts/verify-admin-task-links.cjs && node scripts/verify-admin-task-refresh.cjs && node scripts/verify-usage-maker.cjs && node scripts/verify-spare-body-reference.cjs && node scripts/verify-inventory-column-filters.cjs && node scripts/verify-inventory-comment-edit.cjs && node scripts/verify-inventory-multi-filter.cjs && node scripts/verify-delivery-purchaser-comment.cjs && node scripts/verify-return-purchase-reference.cjs && node scripts/verify-delivery-search.cjs && node scripts/verify-delivery-all-products.cjs && node scripts/verify-delivery-overview-spare-order.cjs

      - name: 動作不良報告の写真添付
        run: node supabase/functions/malfunction-report-photos/index_test.cjs && node scripts/verify-malfunction-report-photos.cjs && node scripts/verify-admin-review-photos.cjs && node scripts/verify-return-tasks.cjs && node scripts/verify-packing-photo-tasks.cjs

      - name: Gemini検索語と手編集保護
        run: node --test supabase/functions/listing-ai-keywords/index_test.cjs && node scripts/verify-listing-keywords.cjs && node scripts/verify-shipping-actions.cjs

      - name: LINE連携の署名と本人確認
        run: node scripts/verify-line-photo-order.cjs && node --test supabase/functions/delivery-push/index_test.cjs supabase/functions/delivery-line/index_test.cjs supabase/functions/delivery-line/media_test.cjs supabase/functions/delivery-line/photo-recovery_test.cjs scripts/extension-tests/auth-schedule.test.mjs scripts/extension-tests/line-patrol.test.mjs

      - name: 仕入れリストの購入履歴同期
        run: node scripts/verify-purchase-list-refresh.cjs && node scripts/verify-purchase-sync-button.cjs && node --test scripts/extension-tests/purchase-sync.test.mjs

      - name: 移行スクリプトの文法チェック
        run: node --check scripts/import-sheets.mjs

  # ── データベース側: スキーマと権限設定が壊れていないか確認する ────
  database:
    name: データベースの検証
    runs-on: ubuntu-24.04

    # 使い捨ての PostgreSQL を立てて、そこにマイグレーションを流す
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: psql を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # SKU の自動採番、納品担当者に他人の商品が見えないこと、
      # 仕入金額を書き換えられないこと、古物台帳と集計が出ることを確認する
      - name: スキーマと権限の検証
        run: supabase/tests/run.sh

      # ダッシュボードに貼り付ける setup-all.sql が migrations とずれていないか
      - name: SQL バンドルが最新か確認
        run: scripts/build-sql-bundle.sh --check
