project_id = "bussan-kanri"

[api]
enabled = true
port = 54321
# app スキーマを PostgREST に公開する（テーブル・ビュー・RPC はすべてここに置く）
schemas = ["public", "app", "storage", "graphql_public"]
extra_search_path = ["public", "extensions", "app"]
max_rows = 2000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5174"]
jwt_expiry = 3600
enable_signup = false          # 招待制。勝手にアカウントを作らせない
[auth.email]
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "20MiB"

# JWT is validated with Supabase Auth inside the function before any Amazon call.
[functions.amazon-fba-inventory]
verify_jwt = false

# Auth.getUser and app.is_admin are checked before reads or writes.
[functions.amazon-payments]
verify_jwt = false

[functions.delivery-photo-drive]
verify_jwt = false

[functions.delivery-photo-delete]
verify_jwt = false

# Validates Auth.getUser, active staff and the assigned item before Drive uploads.
[functions.malfunction-report-photos]
verify_jwt = false

# Email-only login deliberately creates an authenticated session for the selected staff email.
[functions.email-only-login]
verify_jwt = false

# Validates Auth.getUser for settings and a Vault token for the queue dispatcher.
[functions.delivery-push]
verify_jwt = false

# Auth.getUser + active staff for settings; raw-body LINE HMAC for webhook;
# private Vault token for dispatch. All three routes enforce their own auth.
[functions.delivery-line]
verify_jwt = false

# Auth.getUser plus assigned staff validation; Gemini credentials stay server-side.
[functions.listing-ai-keywords]
verify_jwt = false
